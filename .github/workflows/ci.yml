name: Python CI - Flight Delay Risk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02_continuous_integration

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 02_continuous_integration/pyproject.toml

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install build

      - name: Run automated tests
        run: python -m pytest -q --junitxml=reports/junit.xml

      - name: Build wheel and source package
        run: python -m build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-report
          path: 02_continuous_integration/reports/junit.xml

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: flight-risk-packages
          path: 02_continuous_integration/dist/*
